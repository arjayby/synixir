# Example only. Set the target and mount the metrics token before running a collector.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: synixir
    metrics_path: /metrics
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/synixir_metrics_token
    static_configs:
      - targets: ["127.0.0.1:4000"]
