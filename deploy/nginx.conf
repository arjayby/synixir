events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_header_timeout 10s;
  client_body_timeout 10s;
  keepalive_timeout 15s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  limit_conn_zone $binary_remote_addr zone=connections:10m;
  # Static chunk fan-out must not exhaust the API and WebSocket request budget.
  map "$request_method:$uri" $request_limit_key {
    default $binary_remote_addr;
    ~^(GET|HEAD):/_next/static/ "";
  }
  limit_req_zone $request_limit_key zone=requests:10m rate=30r/s;
  # Resolve a replaced app container through Docker's DNS without keeping its old IP.
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream synixir {
    zone upstreams 64k;
    server app:4000 resolve;
  }
  server {
    listen 8443 ssl;
    server_name localhost;
    if ($host != localhost) { return 421; }
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    limit_conn connections 64;
    limit_req zone=requests burst=120 nodelay;
    limit_req_status 429;
    limit_conn_status 429;
    # Keep the query string, which can include Phoenix join parameters, out of logs.
    access_log off;
    location = /metrics { return 404; }
    location / {
      proxy_pass http://synixir;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Port "";
      proxy_read_timeout 75s;
      proxy_buffering off;
    }
  }
}
