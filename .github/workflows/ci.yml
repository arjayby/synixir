name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Format, compile, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Fetch locked dependencies
        run: mix deps.get --check-locked

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

      - name: Set up Node.js for the browser example
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: examples/collaboration/.nvmrc

      - name: Install browser example dependencies
        working-directory: examples/collaboration
        run: npm ci

      - name: Build the browser example
        working-directory: examples/collaboration
        run: npm run build

      - name: Install Chromium
        working-directory: examples/collaboration
        run: npx playwright install --with-deps --only-shell chromium

      - name: Check browser interoperability
        working-directory: examples/collaboration
        run: npm test
