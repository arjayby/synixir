name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Docker release and HTTPS staging pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js for the packaged browser pilot
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: examples/collaboration/.nvmrc

      - name: Install pilot dependencies
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium

      - name: Build the production image on native AMD64
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t synixir:ci .

      - name: Rehearse HTTPS, native libraries, replacement and database recovery
        run: python3 scripts/staging.py rehearse --image synixir:ci --output /tmp/synixir-release-pilot.json

  test:
    name: Format, compile, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Fetch locked dependencies
        run: mix deps.get --check-locked

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

      - name: Set up Node.js for the browser example
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: examples/collaboration/.nvmrc

      - name: Install JavaScript workspace dependencies
        run: npm ci

      - name: Test the client SDK
        run: npm test

      - name: Verify the packed client SDK
        run: npm run test:package

      - name: Build the browser examples
        run: npm run build

      - name: Install Chromium
        working-directory: examples/collaboration
        run: npx playwright install --with-deps --only-shell chromium

      - name: Check browser interoperability
        working-directory: examples/collaboration
        run: npm test

      - name: Verify backup restoration and concurrent limits in isolated databases
        run: python3 scripts/operations/database.py --docker-container '${{ job.services.postgres.id }}' drill --output /tmp/synixir-restore.json

      - name: Exercise SDK load, reconnects, large transfers and persisted replay
        run: python3 scripts/operations/database.py --docker-container '${{ job.services.postgres.id }}' load --output /tmp/synixir-load.json

      - name: Validate Prometheus configuration, alert behavior and actual metrics
        env:
          PROMTOOL_IMAGE: prom/prometheus:v3.5.5@sha256:332c2f43e7e389d74d3893b55bb02fbbd684208e681eeb604641d5d769c0fe2a
        run: |
          docker run --rm --network none --entrypoint promtool -v "$PWD/ops:/work:ro" -w /work "$PROMTOOL_IMAGE" check config --syntax-only prometheus.yml
          docker run --rm --network none --entrypoint promtool -v "$PWD/ops:/work:ro" -w /work "$PROMTOOL_IMAGE" check rules alerts.yml
          docker run --rm --network none --entrypoint promtool -v "$PWD/ops:/work:ro" -w /work "$PROMTOOL_IMAGE" test rules alerts.test.yml
          docker run --rm -i --network none --entrypoint promtool "$PROMTOOL_IMAGE" check metrics < /tmp/synixir-load.json.prom
