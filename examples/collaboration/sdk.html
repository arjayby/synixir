<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shared room settings · Synixir SDK example</title>
  </head>
  <body>
    <main>
      <h1>Shared room settings</h1>
      <p>This small SDK example stores a title in a Y.Map. Sign in and create a room
        in the <a href="/">collaboration example</a>, then open this page with the same
        <code>?room=...</code> parameter in two tabs.</p>
      <label>Room title <input id="sdk-title" disabled maxlength="128" /></label>
      <button id="sdk-connection" disabled>Connect</button>
      <p role="status" id="sdk-state">Starting</p>
      <p>Offline changes stay in this tab. Wait for saved before leaving.</p>
    </main>
    <script type="module" src="/sdk.js"></script>
  </body>
</html>
