services:
  - type: web
    name: synixir-playground
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Room ownership currently requires one node. Replace a stopped service
    # rather than using Render's overlapping redeploy/restart flow.
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /health/ready
    # The free plan has no pre-deploy command. Migrate before starting HTTP.
    dockerCommand: /app/bin/render-start
    envVars:
      - key: PHX_SERVER
        value: "true"
      - key: POOL_SIZE
        value: "5"
      - key: DATABASE_URL
        sync: false
      # Phoenix requires at least 64 characters; use mix phx.gen.secret.
      - key: SECRET_KEY_BASE
        sync: false
